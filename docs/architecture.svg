<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" role="img" aria-labelledby="title desc">
  <title id="title">Stellnula architecture</title>
  <desc id="desc">Unified control console with configuration data plane for config and governance rule delivery, plus governance runtime data plane.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#34515e" />
    </marker>
    <style>
      .bg { fill: #f7faf9; }
      .band { fill: #e8f1ef; stroke: #9bb4ad; stroke-width: 1.4; }
      .box { fill: #ffffff; stroke: #54736c; stroke-width: 1.8; rx: 8; }
      .box2 { fill: #fff7eb; stroke: #9b7650; stroke-width: 1.8; rx: 8; }
      .box3 { fill: #eef4fb; stroke: #57799f; stroke-width: 1.8; rx: 8; }
      .box4 { fill: #eef8ef; stroke: #5f8d66; stroke-width: 1.8; rx: 8; }
      .text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #1d2d35; font-size: 20px; }
      .small { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #34515e; font-size: 15px; }
      .label { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #425f66; font-size: 16px; }
      .line { stroke: #34515e; stroke-width: 2.1; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #7a8f97; stroke-width: 2; stroke-dasharray: 7 7; fill: none; marker-end: url(#arrow); }
      .noarrow { stroke: #7a8f97; stroke-width: 1.8; stroke-dasharray: 6 6; fill: none; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1180" height="760" />

  <rect class="band" x="80" y="40" width="1020" height="96" rx="10" />
  <text class="text" x="590" y="82" text-anchor="middle">服务治理控制台 / Control Plane</text>
  <text class="small" x="590" y="112" text-anchor="middle">统一鉴权、审批、审计、发布、回滚、影响面分析</text>

  <rect class="box" x="120" y="205" width="410" height="92" />
  <text class="text" x="325" y="242" text-anchor="middle">配置中心数据面</text>
  <text class="small" x="325" y="268" text-anchor="middle">HTTP bootstrap / gRPC watch / 服务端缓存</text>

  <rect class="box2" x="650" y="205" width="410" height="92" />
  <text class="text" x="855" y="242" text-anchor="middle">服务治理数据面</text>
  <text class="small" x="855" y="268" text-anchor="middle">分布式限流服务端 / MCP 服务</text>

  <rect class="box3" x="120" y="365" width="410" height="92" />
  <text class="text" x="325" y="402" text-anchor="middle">配置与治理规则</text>
  <text class="small" x="325" y="428" text-anchor="middle">应用配置 / 公共配置 / 路由 / 限流 / 熔断 / 降级</text>

  <rect class="box4" x="120" y="540" width="410" height="92" />
  <text class="text" x="325" y="577" text-anchor="middle">统一客户端订阅</text>
  <text class="small" x="325" y="603" text-anchor="middle">Config Client / Governance SDK / Sidecar / Gateway</text>

  <rect class="box2" x="650" y="365" width="410" height="92" />
  <text class="text" x="855" y="402" text-anchor="middle">运行期治理能力</text>
  <text class="small" x="855" y="428" text-anchor="middle">全局配额 / 令牌桶 / 滑动窗口 / Agent 工具接口</text>

  <rect class="box4" x="650" y="540" width="410" height="92" />
  <text class="text" x="855" y="577" text-anchor="middle">治理运行时调用</text>
  <text class="small" x="855" y="603" text-anchor="middle">限流判断 / 配额扣减 / MCP 能力访问</text>

  <path class="line" d="M590 136 L590 165 L325 165 L325 203" />
  <path class="line" d="M590 136 L590 165 L855 165 L855 203" />

  <path class="line" d="M325 297 L325 363" />
  <path class="line" d="M325 457 L325 538" />

  <path class="line" d="M855 297 L855 363" />
  <path class="line" d="M855 457 L855 538" />

  <path class="dashed" d="M530 411 C590 378 590 332 650 286" />
  <text class="label" x="590" y="356" text-anchor="middle">治理规则通过配置中心下发</text>

  <path class="dashed" d="M530 586 C590 555 590 525 650 586" />
  <text class="label" x="590" y="535" text-anchor="middle">运行时只调用治理能力</text>

  <path class="noarrow" d="M640 210 L640 640" />
  <text class="label" x="590" y="704" text-anchor="middle">边界：服务治理数据面不提供独立规则发布、订阅或下发通道</text>
</svg>
